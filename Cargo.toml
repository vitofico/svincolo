[package]
name = "svincolo"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
bytes = "1"
futures-util = "0.3"
http-body = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
jsonschema = { version = "0.60.2", default-features = false }
memchr = "2"
mime = "0.3"
reqwest = { version = "0.13.4", default-features = false, features = ["http2", "rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11"
socket2 = "0.6"
subtle = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
uuid = { version = "1", features = ["v4"] }
webpki-roots = "1"

[dev-dependencies]
hyper = { version = "1", features = ["http2"] }
tempfile = "3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
