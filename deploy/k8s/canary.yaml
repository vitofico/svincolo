apiVersion: v1
kind: Namespace
metadata:
  name: svincolo
---
apiVersion: v1
kind: Service
metadata:
  name: svincolo
  namespace: svincolo
spec:
  selector:
    app.kubernetes.io/name: svincolo
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-by-default
  namespace: svincolo
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: svincolo
  namespace: svincolo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: svincolo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: svincolo
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: svincolo
          image: svincolo:canary
          imagePullPolicy: Never
          args: ["serve", "--config", "/run/svincolo/svincolo.toml"]
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          volumeMounts:
            - name: config
              mountPath: /run/svincolo
              readOnly: true
      volumes:
        - name: config
          secret:
            secretName: svincolo-config
            defaultMode: 0440
